<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MEmory">
  <meta name="theme-color" content="#1a1a1a">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%231a1a1a' width='192' height='192' rx='32'/><text x='50%' y='54%' font-size='108' fill='%234a9eff' text-anchor='middle' dominant-baseline='central' font-family='system-ui' font-weight='700'>M</text></svg>">
  <title>MEmory</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ===== Design System (Deuce) ===== */
    :root {
      --color-bg: #1a1a1a;
      --color-surface: #2d2d2d;
      --color-border: #404040;
      --color-text-primary: #ffffff;
      --color-text-secondary: #b0b0b0;
      --color-accent: #4a9eff;
      --color-accent-hover: #357abd;
      --color-success: #4caf50;
      --color-error: #f44336;

      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;

      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;

      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-size-sm: 13px;
      --font-size-base: 16px;
      --font-size-lg: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body, #root {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      font-size: var(--font-size-base);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ===== App Shell (Devo — JRO-209) ===== */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding-top: max(0px, env(safe-area-inset-top));
      padding-bottom: max(0px, env(safe-area-inset-bottom));
      padding-left: max(0px, env(safe-area-inset-left));
      padding-right: max(0px, env(safe-area-inset-right));
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--spacing-md);
      border-bottom: 1px solid var(--color-border);
      background-color: var(--color-surface);
      flex-shrink: 0;
    }

    .app-title {
      font-size: var(--font-size-lg);
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-md);
    }

    /* ===== Settings Button (Devo — JRO-209) ===== */
    .settings-button {
      background: none;
      border: none;
      color: var(--color-text-secondary);
      font-size: 20px;
      cursor: pointer;
      padding: var(--spacing-sm);
      border-radius: var(--radius-md);
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }
    .settings-button:active { background-color: var(--color-border); }

    /* ===== Settings Modal (Devo — JRO-209) ===== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: flex-end;
      z-index: 1000;
    }
    .modal-overlay.hidden { display: none; }

    .modal-content {
      background: var(--color-surface);
      width: 100%;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: var(--spacing-lg);
      max-height: 85vh;
      overflow-y: auto;
      padding-bottom: max(var(--spacing-lg), env(safe-area-inset-bottom));
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-lg);
    }

    .modal-title { font-size: var(--font-size-lg); font-weight: 700; }

    .modal-close {
      background: none;
      border: none;
      color: var(--color-text-secondary);
      font-size: 22px;
      cursor: pointer;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .settings-group { margin-bottom: var(--spacing-lg); }

    .settings-label {
      display: block;
      font-size: var(--font-size-sm);
      font-weight: 600;
      text-transform: uppercase;
      color: var(--color-text-secondary);
      margin-bottom: var(--spacing-sm);
      letter-spacing: 0.5px;
    }

    .settings-input {
      width: 100%;
      padding: 12px;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-text-primary);
      font-size: var(--font-size-base);
      font-family: 'Monaco', 'Courier New', monospace;
    }
    .settings-input:focus { outline: none; border-color: var(--color-accent); }
    .settings-input::placeholder { color: #555; }

    .settings-description {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
    }
    .settings-description a { color: var(--color-text-secondary); }

    .settings-actions {
      display: flex;
      gap: var(--spacing-sm);
      margin-top: var(--spacing-lg);
    }

    .status-message {
      font-size: var(--font-size-sm);
      text-align: center;
      margin-top: var(--spacing-sm);
      padding: var(--spacing-sm);
      border-radius: var(--radius-sm);
    }
    .status-success { background: #1a3a1a; color: #6ce96c; }

    /* ===== Buttons (Deuce — JRO-213) ===== */
    .button {
      padding: 10px 16px;
      min-height: 44px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: var(--font-size-base);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      -webkit-user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
      white-space: nowrap;
    }
    .button:active { transform: scale(0.97); }
    .button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .button-primary { background-color: var(--color-accent); color: #ffffff; flex: 1; }
    .button-primary:hover:not(:disabled) { background-color: var(--color-accent-hover); }
    .button-secondary { background-color: var(--color-border); color: var(--color-text-primary); }
    .button-secondary:hover:not(:disabled) { opacity: 0.8; }
    .button-sm { padding: 8px 12px; font-size: var(--font-size-sm); min-height: 44px; }

    /* ===== Upload Area (Devo — JRO-210) ===== */
    .upload-area {
      border: 2px dashed var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-xl);
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
      margin-bottom: var(--spacing-md);
    }
    .upload-area:active { border-color: var(--color-accent); background-color: rgba(74,158,255,0.05); }

    .upload-icon { font-size: 40px; margin-bottom: var(--spacing-md); }
    .upload-text { font-size: var(--font-size-base); color: var(--color-text-secondary); margin-bottom: var(--spacing-xs); }
    .upload-subtext { font-size: var(--font-size-sm); color: #666; }
    .file-input { display: none; }

    .file-selected {
      background: var(--color-surface);
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      margin-bottom: var(--spacing-md);
    }

    /* ===== Loading Spinner ===== */
    .loading-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .loading-spinner.accent {
      border: 2px solid var(--color-border);
      border-top-color: var(--color-accent);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== Error/Success Messages ===== */
    .error-message {
      background: #3a1a1a;
      border: 1px solid #6c2c2c;
      border-radius: var(--radius-md);
      padding: var(--spacing-sm) var(--spacing-md);
      color: #e96c6c;
      font-size: var(--font-size-sm);
      margin-bottom: var(--spacing-md);
    }

    /* ===== Empty State ===== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      text-align: center;
      padding: var(--spacing-lg);
      gap: var(--spacing-md);
    }
    .empty-state-icon { font-size: 48px; opacity: 0.5; }
    .empty-state-title { font-size: var(--font-size-lg); font-weight: 600; }
    .empty-state-message { font-size: var(--font-size-sm); color: var(--color-text-secondary); max-width: 280px; }

    /* ===== Transcript Panel (Devo + Deuce — JRO-210, JRO-213) ===== */
    .transcript-panel {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-md);
      padding-bottom: var(--spacing-md);
      border-bottom: 1px solid var(--color-border);
    }
    .panel-title { font-size: var(--font-size-lg); font-weight: 600; }
    .panel-actions { display: flex; gap: var(--spacing-sm); flex-wrap: wrap; }

    .panel-content {
      font-size: var(--font-size-sm);
      line-height: 1.7;
      color: var(--color-text-primary);
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 260px;
      overflow-y: auto;
      padding: var(--spacing-md);
      background: rgba(0,0,0,0.2);
      border-radius: var(--radius-sm);
      margin-bottom: var(--spacing-md);
    }

    /* ===== Template Selector (Deuce — JRO-211) ===== */
    .section-label {
      font-size: var(--font-size-sm);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-text-secondary);
      margin-bottom: var(--spacing-md);
    }

    .template-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-md);
    }
    @media (min-width: 600px) {
      .template-grid { grid-template-columns: 1fr 1fr; }
    }

    .template-card {
      padding: var(--spacing-md);
      border: 2px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      -webkit-user-select: none;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .template-card:active, .template-card:hover { border-color: var(--color-accent); background: rgba(74,158,255,0.05); }
    .template-card.selected { border-color: var(--color-accent); background: rgba(74,158,255,0.1); }

    .template-card-title { font-size: var(--font-size-sm); font-weight: 600; margin-bottom: 2px; }
    .template-card-desc { font-size: 12px; color: var(--color-text-secondary); }

    /* ===== Summary Panel (Deuce — JRO-211 + JRO-213) ===== */
    .summary-panel {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }

    /* ===== Chat Interface (Deuce — JRO-212) ===== */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 400px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      overflow: hidden;
      margin-bottom: var(--spacing-lg);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-md);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }

    .chat-message { display: flex; flex-direction: column; align-items: flex-start; }
    .chat-message.user { align-items: flex-end; }

    .chat-bubble {
      max-width: 85%;
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-md);
      word-wrap: break-word;
      white-space: pre-wrap;
      font-size: var(--font-size-sm);
      line-height: 1.5;
    }
    .chat-message.assistant .chat-bubble {
      background: var(--color-border);
      color: var(--color-text-primary);
      border-bottom-left-radius: 2px;
    }
    .chat-message.user .chat-bubble {
      background: var(--color-accent);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .chat-timestamp { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }

    .chat-input-row {
      padding: var(--spacing-sm) var(--spacing-md);
      border-top: 1px solid var(--color-border);
      background: rgba(0,0,0,0.2);
      display: flex;
      gap: var(--spacing-sm);
      align-items: flex-end;
    }

    .chat-input {
      flex: 1;
      padding: var(--spacing-sm) var(--spacing-md);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      font-size: var(--font-size-sm);
      resize: none;
      max-height: 80px;
    }
    .chat-input:focus { outline: none; border-color: var(--color-accent); }

    .chat-footer-actions {
      display: flex;
      gap: var(--spacing-sm);
      flex-wrap: wrap;
      margin-top: var(--spacing-sm);
    }

    /* ===== Copy toast ===== */
    .copy-wrap { position: relative; }
    .copy-toast {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-success);
      color: #fff;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
      animation: fadeUp 2s ease forwards;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateX(-50%) translateY(4px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ===== Responsive ===== */
    @media (min-width: 640px) {
      .modal-overlay { align-items: center; }
      .modal-content { border-radius: var(--radius-lg); width: 90%; max-width: 480px; max-height: 90vh; margin: 0 auto; }
      .chat-container { height: 480px; }
    }
    @media (max-width: 480px) {
      .panel-actions, .chat-footer-actions { flex-direction: column; }
      .panel-actions .button, .chat-footer-actions .button { width: 100%; }
      .chat-bubble { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ===== Templates (Deuce — JRO-211) ===== */
    const TEMPLATES = [
      {
        id: 'meeting',
        title: 'Meeting Notes + Action Items',
        desc: 'Structured notes with action items',
        prompt: `Summarize this transcript as meeting notes with:\n1. Key Discussion Points\n2. Decisions Made\n3. Action Items (with owners if mentioned)\n4. Next Steps\n\nFormat clearly with headers.`
      },
      {
        id: 'coaching',
        title: '1:1 / Coaching Session',
        desc: 'Goals, progress, coaching insights',
        prompt: `Summarize this 1:1 or coaching session with:\n1. Goals Discussed\n2. Progress on Previous Goals\n3. Key Insights / Coaching Points\n4. Agreements / Next Steps\n\nFocus on development and growth.`
      },
      {
        id: 'discovery',
        title: 'Product Discovery / User Interview',
        desc: 'User needs, pain points, quotes',
        prompt: `Summarize this user interview or discovery session with:\n1. User Background / Role\n2. Key Pain Points\n3. Needs & Desires\n4. Notable Quotes\n5. Insights for Product\n\nFormat for product team context.`
      },
      {
        id: 'briefing',
        title: 'Stakeholder Briefing',
        desc: 'Executive summary with context',
        prompt: `Create a stakeholder briefing from this transcript:\n1. Executive Summary (2-3 sentences)\n2. Key Findings\n3. Business Impact\n4. Recommendations\n5. Timeline / Next Steps\n\nBe concise and business-focused.`
      },
      {
        id: 'general',
        title: 'General Notes',
        desc: 'Clean bullet-point summary',
        prompt: `Summarize this transcript as clear, organized bullet points:\n- Main topics covered\n- Key takeaways\n- Decisions or commitments\n- Follow-up items\n\nKeep it concise and scannable.`
      }
    ];

    /* ===== Copy + Download Utilities (Deuce — JRO-213) ===== */
    const copyText = async (text) => {
      try { await navigator.clipboard.writeText(text); return true; }
      catch { return false; }
    };

    const downloadTxt = (text, prefix) => {
      const date = new Date().toISOString().split('T')[0];
      const a = document.createElement('a');
      a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);
      a.download = `${prefix}-${date}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    function CopyBtn({ text, prefix, label = 'Copy' }) {
      const [copied, setCopied] = useState(false);
      const handle = async () => {
        const ok = await copyText(text);
        if (ok) { setCopied(true); setTimeout(() => setCopied(false), 2000); }
      };
      return (
        <div className="copy-wrap">
          {copied && <div className="copy-toast">Copied!</div>}
          <button className="button button-secondary button-sm" onClick={handle}>{label}</button>
        </div>
      );
    }

    function DownloadBtn({ text, prefix, label = 'Download' }) {
      return (
        <button className="button button-secondary button-sm" onClick={() => downloadTxt(text, prefix)}>
          {label}
        </button>
      );
    }

    /* ===== Settings Panel (Devo — JRO-209) ===== */
    function SettingsPanel({ isOpen, onClose, onSave }) {
      const [openAIKey, setOpenAIKey] = useState('');
      const [anthropicKey, setAnthropicKey] = useState('');
      const [saved, setSaved] = useState(false);

      useEffect(() => {
        if (isOpen) {
          setOpenAIKey(localStorage.getItem('OPENAI_API_KEY') || '');
          setAnthropicKey(localStorage.getItem('ANTHROPIC_API_KEY') || '');
          setSaved(false);
        }
      }, [isOpen]);

      const handleSave = () => {
        localStorage.setItem('OPENAI_API_KEY', openAIKey.trim());
        localStorage.setItem('ANTHROPIC_API_KEY', anthropicKey.trim());
        setSaved(true);
        setTimeout(() => { onSave(); onClose(); }, 1200);
      };

      const handleKeyDown = (e) => { if (e.key === 'Escape') onClose(); };

      return (
        <div
          className={`modal-overlay ${!isOpen ? 'hidden' : ''}`}
          onClick={onClose}
          role="dialog"
          aria-modal="true"
          aria-label="API Settings"
          onKeyDown={handleKeyDown}
        >
          <div className="modal-content" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">API Settings</h2>
              <button className="modal-close" onClick={onClose} aria-label="Close settings">✕</button>
            </div>

            <div className="settings-group">
              <label className="settings-label" htmlFor="openai-key">OpenAI API Key</label>
              <input
                id="openai-key"
                type="password"
                className="settings-input"
                placeholder="sk-..."
                value={openAIKey}
                onChange={(e) => setOpenAIKey(e.target.value)}
                autoComplete="off"
              />
              <div className="settings-description">
                Used for Whisper transcription. Get it at{' '}
                <a href="https://platform.openai.com/account/api-keys" target="_blank" rel="noopener noreferrer">
                  platform.openai.com
                </a>
              </div>
            </div>

            <div className="settings-group">
              <label className="settings-label" htmlFor="anthropic-key">Anthropic API Key</label>
              <input
                id="anthropic-key"
                type="password"
                className="settings-input"
                placeholder="sk-ant-..."
                value={anthropicKey}
                onChange={(e) => setAnthropicKey(e.target.value)}
                autoComplete="off"
              />
              <div className="settings-description">
                Used for summarization and chat. Get it at{' '}
                <a href="https://console.anthropic.com/account/keys" target="_blank" rel="noopener noreferrer">
                  console.anthropic.com
                </a>
              </div>
            </div>

            {saved && <div className="status-message status-success">Keys saved ✓</div>}

            <div className="settings-actions">
              <button className="button button-secondary" onClick={onClose}>Cancel</button>
              <button className="button button-primary" onClick={handleSave}>Save Keys</button>
            </div>
          </div>
        </div>
      );
    }

    /* ===== Audio Upload + Whisper (Devo — JRO-210) ===== */
    function AudioUpload({ onTranscript }) {
      const [file, setFile] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const fileRef = useRef(null);

      const VALID_EXTS = ['.m4a', '.mp3', '.wav'];

      const pick = (f) => {
        if (!f) return;
        const ext = '.' + f.name.split('.').pop().toLowerCase();
        if (!VALID_EXTS.includes(ext)) {
          setError('Unsupported format. Please use .m4a, .mp3, or .wav');
          return;
        }
        setFile(f);
        setError('');
      };

      const transcribe = async () => {
        const apiKey = localStorage.getItem('OPENAI_API_KEY');
        if (!apiKey) { setError('Add your OpenAI API key in Settings first'); return; }

        setLoading(true);
        setError('');
        try {
          const form = new FormData();
          form.append('file', file);
          form.append('model', 'whisper-1');

          const res = await fetch('https://api.openai.com/v1/audio/transcriptions', {
            method: 'POST',
            headers: { Authorization: `Bearer ${apiKey}` },
            body: form
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error?.message || `API error ${res.status}`);
          }

          const data = await res.json();
          onTranscript(data.text);
        } catch (e) {
          setError(e.message || 'Transcription failed. Check your API key and try again.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div>
          <div
            className="upload-area"
            onClick={() => fileRef.current?.click()}
            onDrop={(e) => { e.preventDefault(); pick(e.dataTransfer.files[0]); }}
            onDragOver={(e) => e.preventDefault()}
            role="button"
            aria-label="Upload audio file"
          >
            <div className="upload-icon">🎙️</div>
            <div className="upload-text">{file ? 'Tap to change file' : 'Tap to upload audio'}</div>
            <div className="upload-subtext">.m4a, .mp3, .wav</div>
            <input
              ref={fileRef}
              type="file"
              className="file-input"
              accept=".m4a,.mp3,.wav"
              onChange={(e) => pick(e.target.files?.[0])}
            />
          </div>

          {file && (
            <div className="file-selected">📄 {file.name}</div>
          )}

          {error && <div className="error-message">{error}</div>}

          {file && (
            <button
              className="button button-primary"
              style={{ width: '100%' }}
              onClick={transcribe}
              disabled={loading}
            >
              {loading
                ? <><span className="loading-spinner"></span>&nbsp; Transcribing...</>
                : 'Transcribe'
              }
            </button>
          )}
        </div>
      );
    }

    /* ===== Template Selector (Deuce — JRO-211) ===== */
    function TemplateSelector({ selected, onSelect, onSummarize, loading }) {
      return (
        <div style={{ marginBottom: 'var(--spacing-lg)' }}>
          <div className="section-label">Choose Summary Style</div>
          <div className="template-grid">
            {TEMPLATES.map(t => (
              <div
                key={t.id}
                className={`template-card ${selected === t.id ? 'selected' : ''}`}
                onClick={() => onSelect(t.id)}
                role="button"
                aria-pressed={selected === t.id}
              >
                <div className="template-card-title">{t.title}</div>
                <div className="template-card-desc">{t.desc}</div>
              </div>
            ))}
          </div>
          <button
            className="button button-primary"
            style={{ width: '100%' }}
            onClick={onSummarize}
            disabled={!selected || loading}
          >
            {loading
              ? <><span className="loading-spinner"></span>&nbsp; Summarizing...</>
              : 'Summarize'
            }
          </button>
        </div>
      );
    }

    /* ===== Chat Interface (Deuce — JRO-212) ===== */
    function ChatInterface({ transcript }) {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const bottomRef = useRef(null);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const send = async () => {
        const text = input.trim();
        if (!text || loading) return;
        setInput('');
        const userMsg = { role: 'user', content: text, ts: new Date() };
        setMessages(prev => [...prev, userMsg]);
        setLoading(true);

        try {
          const apiKey = localStorage.getItem('ANTHROPIC_API_KEY');
          if (!apiKey) throw new Error('Add your Anthropic API key in Settings first');

          const history = messages.map(m => ({ role: m.role, content: m.content }));
          history.push({ role: 'user', content: text });

          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01',
              'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({
              model: 'claude-sonnet-4-6',
              max_tokens: 1024,
              system: `You are a helpful assistant. The user wants to discuss the following transcript:\n\n${transcript}\n\nAnswer questions based on this transcript.`,
              messages: history
            })
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error?.message || `API error ${res.status}`);
          }

          const data = await res.json();
          const reply = data.content?.[0]?.text || 'No response';
          setMessages(prev => [...prev, { role: 'assistant', content: reply, ts: new Date() }]);
        } catch (e) {
          setMessages(prev => [...prev, { role: 'assistant', content: `⚠️ ${e.message}`, ts: new Date() }]);
        } finally {
          setLoading(false);
        }
      };

      const onKey = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
      };

      const clearChat = () => {
        if (window.confirm('Clear chat history? Transcript stays.')) setMessages([]);
      };

      const chatText = messages.map(m => `${m.role.toUpperCase()}: ${m.content}`).join('\n\n');

      return (
        <div>
          <div className="section-label" style={{ marginBottom: 'var(--spacing-md)' }}>Ask Claude</div>
          <div className="chat-container">
            <div className="chat-messages">
              {messages.length === 0 && (
                <div style={{ margin: 'auto', textAlign: 'center', color: 'var(--color-text-secondary)', fontSize: 'var(--font-size-sm)' }}>
                  Ask a question about the transcript
                </div>
              )}
              {messages.map((m, i) => (
                <div key={i} className={`chat-message ${m.role}`}>
                  <div className="chat-bubble">{m.content}</div>
                  <div className="chat-timestamp">
                    {m.ts.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                  </div>
                </div>
              ))}
              {loading && (
                <div className="chat-message assistant">
                  <div className="chat-bubble" style={{ color: 'var(--color-text-secondary)' }}>
                    <span className="loading-spinner accent"></span>
                  </div>
                </div>
              )}
              <div ref={bottomRef} />
            </div>
            <div className="chat-input-row">
              <textarea
                className="chat-input"
                placeholder="Ask about the transcript..."
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={onKey}
                disabled={loading}
                rows={1}
                aria-label="Chat input"
              />
              <button
                className="button button-primary button-sm"
                onClick={send}
                disabled={!input.trim() || loading}
              >
                Send
              </button>
            </div>
          </div>
          {messages.length > 0 && (
            <div className="chat-footer-actions">
              <CopyBtn text={chatText} label="Copy Chat" />
              <DownloadBtn text={chatText} prefix="chat" label="Download Chat" />
              <button className="button button-secondary button-sm" onClick={clearChat}>Clear</button>
            </div>
          )}
        </div>
      );
    }

    /* ===== Main App (orchestrates full flow) ===== */
    function MEmory() {
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [hasKeys, setHasKeys] = useState(false);
      const [transcript, setTranscript] = useState('');
      const [selectedTemplate, setSelectedTemplate] = useState(null);
      const [summary, setSummary] = useState('');
      const [summaryLoading, setSummaryLoading] = useState(false);

      const checkKeys = useCallback(() => {
        setHasKeys(!!localStorage.getItem('OPENAI_API_KEY'));
      }, []);

      useEffect(() => {
        checkKeys();
        window.addEventListener('storage', checkKeys);
        return () => window.removeEventListener('storage', checkKeys);
      }, [checkKeys]);

      const handleTranscript = (text) => {
        setTranscript(text);
        setSummary('');
        setSelectedTemplate(null);
      };

      const handleSummarize = async () => {
        const apiKey = localStorage.getItem('ANTHROPIC_API_KEY');
        if (!apiKey) { alert('Add your Anthropic API key in Settings first'); return; }

        const tpl = TEMPLATES.find(t => t.id === selectedTemplate);
        if (!tpl) return;

        setSummaryLoading(true);
        setSummary('');
        try {
          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01',
              'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({
              model: 'claude-sonnet-4-6',
              max_tokens: 2048,
              messages: [{
                role: 'user',
                content: `${tpl.prompt}\n\nTranscript:\n${transcript}`
              }]
            })
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error?.message || `API error ${res.status}`);
          }

          const data = await res.json();
          setSummary(data.content?.[0]?.text || '');
        } catch (e) {
          setSummary(`⚠️ ${e.message}`);
        } finally {
          setSummaryLoading(false);
        }
      };

      return (
        <div className="app-container">
          <div className="app-header">
            <h1 className="app-title">MEmory</h1>
            <button
              className="settings-button"
              onClick={() => setSettingsOpen(true)}
              aria-label="Open settings"
            >
              ⚙️
            </button>
          </div>

          <div className="app-content">
            {!hasKeys ? (
              /* Empty state — no keys configured */
              <div className="empty-state">
                <div className="empty-state-icon">🔑</div>
                <div className="empty-state-title">Configure API Keys</div>
                <div className="empty-state-message">
                  MEmory needs OpenAI (Whisper) and Anthropic (Claude) API keys to get started.
                </div>
                <button className="button button-primary" style={{ marginTop: 8 }} onClick={() => setSettingsOpen(true)}>
                  Open Settings
                </button>
              </div>
            ) : !transcript ? (
              /* Step 1 — Upload audio */
              <AudioUpload onTranscript={handleTranscript} />
            ) : (
              /* Steps 2–4 — Transcript → Summarize → Chat */
              <>
                {/* Transcript panel (JRO-210 + JRO-213) */}
                <div className="transcript-panel">
                  <div className="panel-header">
                    <div className="panel-title">Transcript</div>
                    <button
                      className="button button-secondary button-sm"
                      onClick={() => { setTranscript(''); setSummary(''); setSelectedTemplate(null); }}
                    >
                      New File
                    </button>
                  </div>
                  <div className="panel-content">{transcript}</div>
                  <div className="panel-actions">
                    <CopyBtn text={transcript} label="Copy" />
                    <DownloadBtn text={transcript} prefix="transcript" label="Download" />
                  </div>
                </div>

                {/* Template selector (JRO-211) */}
                <TemplateSelector
                  selected={selectedTemplate}
                  onSelect={setSelectedTemplate}
                  onSummarize={handleSummarize}
                  loading={summaryLoading}
                />

                {/* Summary panel (JRO-211 + JRO-213) */}
                {summary && (
                  <div className="summary-panel">
                    <div className="panel-header">
                      <div className="panel-title">
                        Summary: {TEMPLATES.find(t => t.id === selectedTemplate)?.title}
                      </div>
                    </div>
                    <div className="panel-content">{summary}</div>
                    <div className="panel-actions">
                      <CopyBtn text={summary} label="Copy" />
                      <DownloadBtn text={summary} prefix="summary" label="Download" />
                      <button
                        className="button button-secondary button-sm"
                        onClick={() => { setSummary(''); setSelectedTemplate(null); }}
                      >
                        New Summary
                      </button>
                    </div>
                  </div>
                )}

                {/* Chat interface (JRO-212) */}
                <ChatInterface transcript={transcript} />
              </>
            )}
          </div>

          <SettingsPanel
            isOpen={settingsOpen}
            onClose={() => setSettingsOpen(false)}
            onSave={checkKeys}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MEmory />);

    /* Register service worker */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
